on:
  push:
    branches:
      - master
  pull_request:

name: test

env:
  RUSTUP_TOOLCHAIN: 1.100.0

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Set profile
        run: rustup set profile minimal
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Run cargo test
        run: make cargo-test
      - name: Run wasm-pack test
        run: make wasm-test

  regtest-test:
    name: Run regtest tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Set profile
        run: rustup set profile minimal
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Start regtest environment
        working-directory: regtest
        env:
          COMPOSE_PROFILES: ci, esplora
        run: sh start.sh
      - name: Permissions for regtest data
        run: sudo chmod -R 777 regtest/boltz
      - name: Run cargo regtest tests
        run: make cargo-regtest-test
      - name: Run WASM regtest tests
        run: make wasm-regtest-test
      - name: Build bindings
        working-directory: bindings
        run: make build-debug
      - name: Run bindings tests
        working-directory: bindings
        run: make test
