[package]
name = "bindings"
version = "0.1.0"
edition = "2021"

[dependencies]
elements = "0.25.0"
thiserror = "1.0.50"
uniffi = { version = "0.29.1", features = ["cli", "tokio"] }
serde_json = "1"
boltz-client = { path = "..", features = ["ws", "esplora", "electrum"] }
bitcoin = "0.32.5"
async-trait = "0.1.88"
tokio = "1.44.1"

[build-dependencies]
uniffi = { version = "0.29.1", features = ["build"] }

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "boltz_client"

#[[bin]]
# This can be whatever name makes sense for your project, but the rest of this tutorial assumes uniffi-bindgen.
#name = "uniffi-bindgen"
#path = "uniffi-bindgen.rs"


[features]
foreign_bindings = []


